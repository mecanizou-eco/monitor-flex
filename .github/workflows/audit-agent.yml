name: Relatório HTML de Auditoria (Redshift)

# Gera o relatório HTML de auditoria, puxando 100% dos atendimentos do
# Redshift via Metabase. 3x/dia em dias úteis (só posta no Slack) + 1x/dia
# todos os dias às 23h59 (posta no Slack E commita o HTML atualizado no
# repositório, para publicação externa).
#
# Horários (America/Sao_Paulo, UTC-3):
#   11h00 BRT -> 14:00 UTC        (seg-sex)
#   15h00 BRT -> 18:00 UTC        (seg-sex)
#   18h30 BRT -> 21:30 UTC        (seg-sex)
#   23h59 BRT -> 02:59 UTC (dia seguinte), todos os dias — também commita o HTML
on:
  schedule:
    - cron: "0 14 * * 1-5"     # 11h00 BRT, seg-sex
    - cron: "0 18 * * 1-5"     # 15h00 BRT, seg-sex
    - cron: "30 21 * * 1-5"    # 18h30 BRT, seg-sex
    - cron: "59 2 * * *"       # 23h59 BRT, todos os dias
  workflow_dispatch:            # permite rodar manualmente pela aba Actions

permissions:
  contents: write

concurrency:
  group: audit-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: America/Sao_Paulo
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Escreve a conta de serviço do Google a partir do secret
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
        run: |
          printf '%s' "$GOOGLE_SA_JSON" > google-sa.json

      - name: Monta .env.local a partir dos secrets
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          TWILIO_SLACK_CHANNEL_ID: ${{ secrets.TWILIO_SLACK_CHANNEL_ID }}
          METABASE_URL: ${{ secrets.METABASE_URL }}
          METABASE_API_KEY: ${{ secrets.METABASE_API_KEY }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          AUDIT_SHEET_TAB: ${{ secrets.AUDIT_SHEET_TAB }}
        run: |
          cat > .env.local <<EOF
          SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN}
          TWILIO_SLACK_CHANNEL_ID=${TWILIO_SLACK_CHANNEL_ID}
          METABASE_URL=${METABASE_URL}
          METABASE_API_KEY=${METABASE_API_KEY}
          GOOGLE_SHEET_ID=${GOOGLE_SHEET_ID}
          GOOGLE_SA_FILE=google-sa.json
          AUDIT_SHEET_TAB=${AUDIT_SHEET_TAB}
          EOF

      - name: Gera relatório HTML interativo e envia ao Slack
        env:
          SLACK_REPORT_CHANNEL: ${{ secrets.SLACK_REPORT_CHANNEL }}
          METABASE_URL: ${{ secrets.METABASE_URL }}
          METABASE_API_KEY: ${{ secrets.METABASE_API_KEY }}
        run: |
          python3 scripts/generate_audit_report.py --post-slack

      - name: Commita o relatório atualizado (só na rodada das 23h59)
        if: github.event.schedule == '59 2 * * *' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "audit-bot"
          git config user.email "audit-bot@users.noreply.github.com"
          git add relatorio_auditoria_mecanizou.html
          if git diff --cached --quiet; then
            echo "Sem mudanças no relatório — nada para commitar."
          else
            git commit -m "chore: atualiza relatório de auditoria ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git push
          fi

      - name: Avisa no Slack se falhar
        if: failure()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.TWILIO_SLACK_CHANNEL_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          token = os.environ["SLACK_BOT_TOKEN"]
          channel = os.environ["SLACK_CHANNEL_ID"]
          run_url = os.environ["RUN_URL"]
          msg = (
              ":red_circle: *Relatório de auditoria falhou*\n"
              "A execução automática não conseguiu rodar nesta janela.\n"
              f"Ver o erro: {run_url}"
          )
          body = json.dumps({"channel": channel, "text": msg, "mrkdwn": True}).encode()
          req = urllib.request.Request(
              "https://slack.com/api/chat.postMessage",
              data=body,
              headers={
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json; charset=utf-8",
              },
          )
          try:
              resp = json.load(urllib.request.urlopen(req))
              if not resp.get("ok"):
                  print(f"[ERRO] Slack respondeu: {resp}")
              else:
                  print(f"Alerta de falha publicado em {channel}")
          except Exception as e:
              print(f"[ERRO] Nao consegui avisar no Slack: {e}")
          PY

      - name: Limpa segredos em disco
        if: always()
        run: rm -f .env.local google-sa.json
