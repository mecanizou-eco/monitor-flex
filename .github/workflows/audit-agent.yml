name: Relatório HTML de Auditoria (Redshift)

# Gera o relatório HTML de auditoria 3x/dia em dias úteis, puxando 100%
# dos atendimentos do Redshift via Metabase.
#
# Horários (America/Sao_Paulo, UTC-3):
#   11h00 BRT -> 14:00 UTC
#   15h00 BRT -> 18:00 UTC
#   18h30 BRT -> 21:30 UTC
on:
  schedule:
    - cron: "0 14 * * 1-5"     # 11h00 BRT, seg-sex
    - cron: "0 18 * * 1-5"     # 15h00 BRT, seg-sex
    - cron: "30 21 * * 1-5"    # 18h30 BRT, seg-sex
  workflow_dispatch:            # permite rodar manualmente pela aba Actions

permissions:
  contents: read

concurrency:
  group: audit-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: America/Sao_Paulo
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Monta .env.local a partir dos secrets
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          TWILIO_SLACK_CHANNEL_ID: ${{ secrets.TWILIO_SLACK_CHANNEL_ID }}
          METABASE_URL: ${{ secrets.METABASE_URL }}
          METABASE_API_KEY: ${{ secrets.METABASE_API_KEY }}
        run: |
          cat > .env.local <<EOF
          SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN}
          TWILIO_SLACK_CHANNEL_ID=${TWILIO_SLACK_CHANNEL_ID}
          METABASE_URL=${METABASE_URL}
          METABASE_API_KEY=${METABASE_API_KEY}
          EOF

      - name: Gera relatório HTML interativo e envia ao Slack
        env:
          SLACK_REPORT_CHANNEL: ${{ secrets.SLACK_REPORT_CHANNEL }}
          METABASE_URL: ${{ secrets.METABASE_URL }}
          METABASE_API_KEY: ${{ secrets.METABASE_API_KEY }}
        run: |
          python3 scripts/generate_audit_report.py --post-slack

      - name: Avisa no Slack se falhar
        if: failure()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.TWILIO_SLACK_CHANNEL_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          token = os.environ["SLACK_BOT_TOKEN"]
          channel = os.environ["SLACK_CHANNEL_ID"]
          run_url = os.environ["RUN_URL"]
          msg = (
              ":red_circle: *Relatório de auditoria falhou*\n"
              "A execução automática não conseguiu rodar nesta janela.\n"
              f"Ver o erro: {run_url}"
          )
          body = json.dumps({"channel": channel, "text": msg, "mrkdwn": True}).encode()
          req = urllib.request.Request(
              "https://slack.com/api/chat.postMessage",
              data=body,
              headers={
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json; charset=utf-8",
              },
          )
          try:
              resp = json.load(urllib.request.urlopen(req))
              if not resp.get("ok"):
                  print(f"[ERRO] Slack respondeu: {resp}")
              else:
                  print(f"Alerta de falha publicado em {channel}")
          except Exception as e:
              print(f"[ERRO] Nao consegui avisar no Slack: {e}")
          PY

      - name: Limpa segredos em disco
        if: always()
        run: rm -f .env.local
